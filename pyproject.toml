[project]
name = "knowledge-copilot"
version = "1.0.0"
description = "Production-style RAG + agent service: FastAPI, Qdrant, OpenAI/Azure OpenAI/Ollama, Prometheus, evals"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "qdrant-client>=1.10",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
    "pypdf>=4.2",
]

[project.optional-dependencies]
azure = ["azure-identity>=1.17"]
local = ["fastembed>=0.3"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools]
packages = ["app", "app.llm", "app.rag", "app.agent", "app.prompts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008", "E731"]  # B008: FastAPI Depends()/File() in defaults is idiomatic
